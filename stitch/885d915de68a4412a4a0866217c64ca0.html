<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sayaç Uygulaması</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#002113",
                        "tertiary-container": "#cf2c30",
                        "on-error": "#690005",
                        "on-tertiary-container": "#ffecea",
                        "on-primary-fixed": "#00174b",
                        "secondary": "#4edea3",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-tertiary": "#68000a",
                        "error": "#ffb4ab",
                        "background": "#0b1326",
                        "on-primary-container": "#eeefff",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-container-low": "#131b2e",
                        "inverse-on-surface": "#283044",
                        "surface-container-high": "#222a3d",
                        "tertiary": "#ffb3ad",
                        "secondary-fixed-dim": "#4edea3",
                        "on-surface": "#dae2fd",
                        "outline": "#8d90a0",
                        "outline-variant": "#434655",
                        "primary-container": "#2563eb",
                        "on-tertiary-fixed": "#410004",
                        "surface-tint": "#b4c5ff",
                        "secondary-container": "#00a572",
                        "surface-container-highest": "#2d3449",
                        "on-error-container": "#ffdad6",
                        "surface": "#0b1326",
                        "tertiary-fixed": "#ffdad7",
                        "surface-container-lowest": "#060e20",
                        "tertiary-fixed-dim": "#ffb3ad",
                        "surface-variant": "#2d3449",
                        "on-secondary-container": "#00311f",
                        "on-background": "#dae2fd",
                        "inverse-primary": "#0053db",
                        "on-surface-variant": "#c3c6d7",
                        "error-container": "#93000a",
                        "primary": "#b4c5ff",
                        "primary-fixed": "#dbe1ff",
                        "surface-dim": "#0b1326",
                        "surface-bright": "#31394d",
                        "on-secondary": "#003824",
                        "on-secondary-fixed-variant": "#005236",
                        "inverse-surface": "#dae2fd",
                        "surface-container": "#171f33",
                        "on-tertiary-fixed-variant": "#930013",
                        "on-primary": "#002a78",
                        "secondary-fixed": "#6ffbbe"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "display": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface-dim text-on-surface h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-[#0b1326]/80 backdrop-blur-xl font-['Inter'] font-medium tracking-tight shadow-2xl shadow-[#060e20]/50 fixed top-0 left-0 w-full z-50 flex items-center justify-between px-6 h-16 border-b border-[#161d2e]">
<div class="text-lg font-bold text-[#b4c5ff]">Sayaç Uygulaması</div>
<div class="flex items-center gap-4 text-[#b4c5ff]">
<button aria-label="History" class="hover:bg-[#161d2e] transition-colors duration-300 p-2 rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="history">history</span>
</button>
<button aria-label="Dark Mode" class="hover:bg-[#161d2e] transition-colors duration-300 p-2 rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center pt-16 pb-20 px-6">
<!-- Counter Display Area -->
<div class="relative flex flex-col items-center justify-center w-full max-w-sm aspect-square bg-surface-container-low rounded-xl shadow-[0_30px_50px_rgba(6,14,32,0.08)] mb-12">
<!-- Glassmorphism overlay for depth -->
<div class="absolute inset-0 bg-surface-container/20 backdrop-blur-sm rounded-xl"></div>
<div class="relative z-10 flex flex-col items-center">
<span class="text-[0.75rem] font-medium text-primary tracking-[0.2em] uppercase mb-4">Mevcut Değer</span>
<!-- The Number -->
<div class="text-[6rem] font-bold text-on-surface leading-none tracking-tighter" style="font-family: 'Inter', sans-serif; letter-spacing: -0.05em;">
                    42
                </div>
</div>
</div>
<!-- Controls -->
<div class="w-full max-w-sm flex flex-col gap-6">
<!-- Plus / Minus Row -->
<div class="flex gap-4 w-full">
<button class="flex-1 h-20 bg-surface-container-high hover:bg-surface-container-highest active:bg-surface-container rounded-lg flex items-center justify-center text-on-surface shadow-[0_10px_20px_rgba(6,14,32,0.05)] transition-all duration-200">
<span class="material-symbols-outlined text-4xl" data-icon="remove">remove</span>
</button>
<button class="flex-1 h-20 bg-primary-container hover:bg-[#3b82f6] active:bg-[#1d4ed8] rounded-lg flex items-center justify-center text-on-primary-container shadow-[0_10px_20px_rgba(37,99,235,0.2)] transition-all duration-200">
<span class="material-symbols-outlined text-4xl" data-icon="add">add</span>
</button>
</div>
<!-- Reset Button -->
<button class="w-full h-14 bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 active:scale-[0.98] rounded-lg flex items-center justify-center gap-2 text-on-surface-variant font-medium transition-all duration-200">
<span class="material-symbols-outlined text-xl" data-icon="refresh">refresh</span>
<span>Sıfırla</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-[#0b1326]/90 backdrop-blur-lg text-[11px] font-semibold uppercase tracking-widest shadow-[0_-10px_40px_rgba(6,14,32,0.8)] fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe rounded-t-2xl border-t border-[#161d2e] md:hidden">
<!-- Active Tab: Sayaç -->
<button class="flex flex-col items-center justify-center bg-[#b4c5ff]/10 text-[#b4c5ff] rounded-xl px-6 py-2 active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined mb-1" data-icon="add_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span>Sayaç</span>
</button>
<!-- Inactive Tab: Geçmiş -->
<button class="flex flex-col items-center justify-center text-[#b4c5ff]/40 px-6 py-2 hover:text-[#b4c5ff] active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span>Geçmiş</span>
</button>
</nav>
</body></html>
