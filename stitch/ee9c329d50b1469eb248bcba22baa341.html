<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sayaç Uygulaması - Geçmiş</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#002113",
                        "tertiary-container": "#cf2c30",
                        "on-error": "#690005",
                        "on-tertiary-container": "#ffecea",
                        "on-primary-fixed": "#00174b",
                        "secondary": "#4edea3",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-tertiary": "#68000a",
                        "error": "#ffb4ab",
                        "background": "#0b1326",
                        "on-primary-container": "#eeefff",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-container-low": "#131b2e",
                        "inverse-on-surface": "#283044",
                        "surface-container-high": "#222a3d",
                        "tertiary": "#ffb3ad",
                        "secondary-fixed-dim": "#4edea3",
                        "on-surface": "#dae2fd",
                        "outline": "#8d90a0",
                        "outline-variant": "#434655",
                        "primary-container": "#2563eb",
                        "on-tertiary-fixed": "#410004",
                        "surface-tint": "#b4c5ff",
                        "secondary-container": "#00a572",
                        "surface-container-highest": "#2d3449",
                        "on-error-container": "#ffdad6",
                        "surface": "#0b1326",
                        "tertiary-fixed": "#ffdad7",
                        "surface-container-lowest": "#060e20",
                        "tertiary-fixed-dim": "#ffb3ad",
                        "surface-variant": "#2d3449",
                        "on-secondary-container": "#00311f",
                        "on-background": "#dae2fd",
                        "inverse-primary": "#0053db",
                        "on-surface-variant": "#c3c6d7",
                        "error-container": "#93000a",
                        "primary": "#b4c5ff",
                        "primary-fixed": "#dbe1ff",
                        "surface-dim": "#0b1326",
                        "surface-bright": "#31394d",
                        "on-secondary": "#003824",
                        "on-secondary-fixed-variant": "#005236",
                        "inverse-surface": "#dae2fd",
                        "surface-container": "#171f33",
                        "on-tertiary-fixed-variant": "#930013",
                        "on-primary": "#002a78",
                        "secondary-fixed": "#6ffbbe"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "display": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface-dim text-on-background font-body h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-6 h-16 bg-[#0b1326]/80 backdrop-blur-xl bg-[#161d2e] shadow-2xl shadow-[#060e20]/50 docked full-width top-0">
<div class="flex-1"></div>
<div class="flex-1 text-center">
<h1 class="text-[#b4c5ff] font-['Inter'] font-medium tracking-tight text-lg font-bold">Sayaç Uygulaması</h1>
</div>
<div class="flex-1 flex justify-end gap-4">
<button class="text-[#b4c5ff]/60 hover:bg-[#161d2e] transition-colors duration-300 active:scale-95 transition-transform p-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary/50">
<span class="material-symbols-outlined" data-icon="history">history</span>
</button>
<button class="text-[#b4c5ff]/60 hover:bg-[#161d2e] transition-colors duration-300 active:scale-95 transition-transform p-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary/50">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
</button>
</div>
</header>
<!-- Main Content: Empty State for History -->
<main class="flex-1 overflow-y-auto pt-24 pb-28 px-4 flex items-center justify-center">
<div class="max-w-md w-full bg-surface-container-low rounded-xl p-8 flex flex-col items-center text-center shadow-[0_20px_50px_rgba(6,14,32,0.5)] border border-outline-variant/10 relative overflow-hidden group">
<!-- Ambient Glow for Empty State -->
<div class="absolute inset-0 bg-gradient-to-b from-primary/5 to-transparent pointer-events-none opacity-50"></div>
<!-- Icon Wrapper with Glassmorphism touch -->
<div class="w-24 h-24 bg-surface-container rounded-full flex items-center justify-center mb-6 relative z-10 shadow-inner">
<div class="absolute inset-0 rounded-full border border-outline-variant/20"></div>
<span class="material-symbols-outlined text-5xl text-outline-variant group-hover:text-primary transition-colors duration-500" style="font-variation-settings: 'wght' 300;">hourglass_empty</span>
</div>
<!-- Text Content -->
<h2 class="font-headline text-xl font-semibold text-on-surface mb-3 relative z-10 tracking-tight">Henüz işlem kaydı yok</h2>
<p class="font-body text-sm text-on-surface-variant leading-relaxed max-w-[280px] relative z-10">Sayaçla işlem yapmaya başladığınızda burada görünecek.</p>
<!-- Optional Call to Action (Implicitly guiding back to counter) -->
<div class="mt-8 relative z-10">
<div class="h-1 w-12 bg-surface-container-high rounded-full mx-auto"></div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe bg-[#0b1326]/90 backdrop-blur-lg bg-[#161d2e] shadow-[0_-10px_40px_rgba(6,14,32,0.8)] docked full-width bottom-0 rounded-t-2xl md:hidden">
<button class="flex flex-col items-center justify-center text-[#b4c5ff]/40 px-6 py-2 hover:text-[#b4c5ff] active:scale-90 transition-all duration-200 focus:outline-none">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="add_circle">add_circle</span>
<span class="text-[11px] font-semibold uppercase tracking-widest">Sayaç</span>
</button>
<button class="flex flex-col items-center justify-center bg-[#b4c5ff]/10 text-[#b4c5ff] rounded-xl px-6 py-2 hover:text-[#b4c5ff] active:scale-90 transition-all duration-200 focus:outline-none">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="history" style="font-variation-settings: 'FILL' 1;">history</span>
<span class="text-[11px] font-semibold uppercase tracking-widest">Geçmiş</span>
</button>
</nav>
<!-- SideNav for Web (Hidden on Mobile) -->
<nav class="hidden md:flex fixed left-0 top-16 bottom-0 w-64 bg-surface-container-low border-r border-outline-variant/10 flex-col py-6 px-4 z-40">
<div class="flex flex-col gap-2">
<button class="flex items-center gap-4 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors focus:outline-none w-full text-left">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
<span class="font-label font-medium tracking-wide">Sayaç</span>
</button>
<button class="flex items-center gap-4 px-4 py-3 rounded-lg bg-primary/10 text-primary hover:bg-primary/20 transition-colors focus:outline-none w-full text-left">
<span class="material-symbols-outlined" data-icon="history" style="font-variation-settings: 'FILL' 1;">history</span>
<span class="font-label font-medium tracking-wide">Geçmiş</span>
</button>
</div>
</nav>
</body></html>
